# Fly.io configuration for the aurora backend.
#
# Deployed by Fly.io's GitHub integration: the app is connected to this
# repository in the Fly dashboard and redeploys automatically on pushes to
# main — no GitHub Actions workflow and no FLY_API_TOKEN repo secret are
# involved. The Docker build context is the repo root because the backend
# imports src/data/spots.json from outside backend/ — see backend/Dockerfile.
#
# The app name below must match the app connected in the Fly dashboard
# (created 2026-08-18 via the dashboard launch flow).

app = "project-aurora"
primary_region = "arn" # Stockholm — closest Fly region to Tromsø

[build]
  dockerfile = "backend/Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  # ADMIN_TOKEN and CORS_ORIGINS are secrets/runtime config — set via
  # `flyctl secrets set` or the Fly dashboard, never here.

[[mounts]]
  source = "aurora_data"
  destination = "/app/backend/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The server refreshes forecasts on an interval — it must never scale to
  # zero or the snapshot goes stale between visitors.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
