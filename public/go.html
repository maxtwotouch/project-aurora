<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tromsø Northern Lights</title>
<meta name="description" content="Where and when to see the northern lights in Tromsø — tonight." />
<meta name="robots" content="noindex, follow" />
<!--
  /go (and /go.html) is the legacy channel-landing URL from before the
  marketing landing moved to the site root -- see docs/marketing-channels.md
  ("root is now the canonical landing"). It is KEPT working, and kept at
  this path, because QR codes printed against the old
  https://aurora.hovding.dev/go?src=<channel> pattern are already in
  circulation (hotel table cards, tourist-info materials, etc.) and cannot
  be reprinted on demand.

  This page no longer duplicates the landing content -- it is now a thin
  redirect to "/" that preserves the full query string (so ?src=<channel>
  survives the hop unchanged), via both a <meta http-equiv="refresh"> (works
  with JavaScript disabled) and an immediate JS redirect (works with cached
  pages / more predictably than meta-refresh in most browsers). Same
  "no analytics, no storage" contract as before: this page makes no network
  call beyond loading itself and redirecting.
-->
<script>
  (function () {
    // Preserve the full query string (?src=<channel> and anything else)
    // across the redirect to the canonical landing at "/". Read-only,
    // nothing stored or sent anywhere from this page.
    var target = "/" + window.location.search;
    window.location.replace(target);
  })();
</script>
<meta http-equiv="refresh" id="meta-refresh" content="0; url=/" />
<style>
  :root {
    --night: #061017;
    --nightSoft: #0d1923;
    --textPrimary: #eef7f4;
    --textSecondary: #bdd0cf;
    --auroraBlue: #89bfff;
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    background: linear-gradient(180deg, var(--night) 0%, var(--nightSoft) 100%);
    color: var(--textPrimary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 20px;
  }
  a {
    color: var(--auroraBlue);
  }
  p {
    color: var(--textSecondary);
    font-size: 15px;
    max-width: 320px;
  }
</style>
<script>
  // The <meta http-equiv="refresh"> tag above always targets "/" without a
  // query string (a static tag can't read location.search), so it's a
  // fallback only for the rare case JS is unavailable but meta-refresh
  // still runs -- the JS redirect above (which does preserve the query
  // string) fires first whenever JavaScript is available, making this
  // effectively a no-op then. When it does run, drop the "unimportant
  // stale content" concern rather than the ?src= tag: still landing the
  // visitor on the right page beats a broken link.
</script>
</head>
<body>
  <noscript>
    <p>
      Redirecting to <a href="/">Tromsø Northern Lights</a>&hellip;
      If you are not redirected automatically, use the link above. Your
      channel tag, if any, is not preserved without JavaScript enabled —
      see <a href="/privacy.html">privacy policy</a>.
    </p>
  </noscript>
</body>
</html>
